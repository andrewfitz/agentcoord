name: Update Homebrew tap

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Stable release tag (empty selects latest)
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: homebrew-tap
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - name: Download the published stable release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          release_args=()
          if [[ -n "$REQUESTED_TAG" ]]; then
            [[ "$REQUESTED_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
            release_args+=("$REQUESTED_TAG")
          fi
          gh release view "${release_args[@]}" --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft,isPrerelease > "$RUNNER_TEMP/homebrew-release.json"
          jq -e '.isDraft == false and .isPrerelease == false' "$RUNNER_TEMP/homebrew-release.json"
          release_tag=$(jq -r .tagName "$RUNNER_TEMP/homebrew-release.json")
          [[ "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"
          gh release download "$release_tag" --repo "$GITHUB_REPOSITORY" \
            --dir "$RUNNER_TEMP/homebrew-release" --pattern agentcoord.rb \
            --pattern SHA256SUMS --pattern agentcoord-install.tar.gz
      - name: Validate and update the formula
        run: |
          python3 scripts/update_homebrew.py --assets "$RUNNER_TEMP/homebrew-release" \
            --tag "$RELEASE_TAG" --repository "$GITHUB_REPOSITORY"
          ruby -c Formula/agentcoord.rb
      - name: Commit the formula update
        shell: bash
        run: |
          set -euo pipefail
          git add -- Formula/agentcoord.rb
          if git diff --cached --quiet -- Formula/agentcoord.rb; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Update Homebrew formula for $RELEASE_TAG"
          git push origin HEAD:main
